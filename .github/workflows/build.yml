name: Build macOS App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

    - name: Build Application
      run: |
        xcodebuild -project "Apple Music Cracked Edition.xcodeproj" \
                   -scheme "Apple Music Cracked Edition" \
                   -configuration Release \
                   -derivedDataPath build \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_ALLOWED=NO \
                   build

    - name: Compress App
      run: |
        cd build/Build/Products/Release
        zip -r AppleMusicCrackedEdition.zip "Apple Music Cracked Edition.app"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Apple-Music-Cracked-Edition-macOS
        path: build/Build/Products/Release/AppleMusicCrackedEdition.zip
